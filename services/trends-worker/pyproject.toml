[project]
name = "stock-insight-trends-worker"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["pika==1.3.2", "pydantic==2.12.5"]

[dependency-groups]
dev = ["basedpyright>=1.31,<2", "ruff>=0.14,<1", "pytest>=9,<10", "types-pika-ts==1.4.0.20260518"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.13"
include = ["src", "tests"]
reportUnusedCallResult = "warning"

[tool.ruff]
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "ISC001", "D203", "D213", "CPY001"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "PLR2004", "D", "ARG"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--strict-config", "--strict-markers"]
filterwarnings = ["error"]
