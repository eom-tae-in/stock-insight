server:
  port: 8080
spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER}
          jwk-set-uri: ${OIDC_JWKS_URI}
          audiences: stock-insight-api
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 3000
            response-timeout: 10s
          routes:
            - id: analysis
              uri: lb://analysis-service
              predicates:
                - Path=/api/v1/analysis/**
            - id: market
              uri: lb://market-data-service
              predicates:
                - Path=/api/v1/market/**
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
logging:
  structured:
    format:
      console: ecs
