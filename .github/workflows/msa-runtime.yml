name: MSA Runtime

on:
  pull_request:
    branches: [develop, prod]
    paths:
      - 'services/**'
      - 'infra/local/**'
      - '.github/workflows/msa-runtime.yml'
      - 'package*.json'
  push:
    branches: [develop]
    paths:
      - 'services/**'
      - 'infra/local/**'
      - '.github/workflows/msa-runtime.yml'

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Build Java services
        working-directory: services
        run: ./gradlew --no-daemon build
      - name: Validate local configuration
        run: docker compose -f infra/local/compose.yml config --quiet
      - name: Start isolated runtime
        run: docker compose -f infra/local/compose.yml up -d --build
      - name: Verify real OIDC and Gateway routes
        run: node --test infra/local/runtime-smoke.test.mjs
      - name: Show runtime diagnostics
        if: failure()
        run: docker compose -f infra/local/compose.yml logs --tail 100
      - name: Stop runtime and preserve volumes
        if: always()
        run: docker compose -f infra/local/compose.yml down
